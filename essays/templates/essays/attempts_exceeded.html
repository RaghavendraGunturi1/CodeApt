{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow-lg border-0 p-5 text-center">
        <i class="bi bi-exclamation-triangle display-3 text-warning mb-4"></i>
        <h2 class="fw-bold mb-3">Essay Attempts Exceeded</h2>
        <p class="lead text-muted mb-4">
          You have reached the maximum number of allowed attempts for this essay.<br>
          <strong>Attempts Used: {{ max_attempts }}</strong>
        </p>
        <a href="/" class="btn btn-primary px-5 fw-bold">Return Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
